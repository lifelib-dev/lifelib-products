# Run the reference-model suites the way lifelib's own CI will run them.
#
# The models here are drafted for merging into lifelib, so the gate in this repository is
# the gate they will meet there: a bare `pytest` from the repository root, which collects
# every library's in-library `tests/` directory in one process. That single-process
# collection is the condition the per-library registry modules exist to survive
# (MERGE.md section 7), so running the suites any other way -- one library at a time --
# would pass while proving less than upstream requires.
#
# The second job, `cython`, is this repository's own rather than a rehearsal of upstream's.
# It runs the compile tests, which need modelx-cython and a C compiler. lifelib's CI will
# not install modelx-cython, and there, as in the `test` job here, those tests skip
# (USLIB-SEC-PLAN.md D13). One shard of them to a leg: the toolchain, or one compiled
# model.
#
# The third job, `sec`, runs uslib's twelve `_US_SEC` test modules, which the `test` job
# leaves out: in every leg of it they took the leg to its 90-minute timeout (Tests run 14,
# USLIB-SEC-PLAN.md K6). One module to a leg, so no leg holds them all.
#
# `cython_uk` is the `cython` job over uklib's compile tests, its shards uklib's own, and
# `sec_uk` is the `sec` job over uklib's `_UK_SEC` modules, Term_UK_SEC's the first
# (UKLIB-SEC-PLAN.md U7). They are copies rather than a library axis on uslib's
# jobs, because uslib's shard test reads the job named `cython` and holds every shard in it
# to uslib's registry, and because a leg takes one library's variables.
#
# A pull request runs what its change can reach, and nothing else. The first job,
# `changes`, reads the paths the pull request's merge commit changes and selects the
# libraries they reach (tools/select_libraries.py): a library's own folder reaches that
# library, and uslib's build_sec_cy.py reaches uklib too, whose suite holds its copy to it
# byte for byte; the documents no test reads, under doc/ and the markdown at the root,
# reach none; and every other path -- this workflow, tools/, the requirements,
# .gitattributes -- reaches every library. The `test` job still collects every library in
# one process, as above, and deselects the tests of the libraries not selected, so that on
# a pull request as on main every library's conftest.py, registry and test modules are
# imported together, and the tests that run, run among them. `cython` and `sec` run where
# uslib is selected, and `cython_uk` and `sec_uk` where uklib is; a pull request that
# reaches no library runs no job but `changes`. A push to main and a manual run select
# nothing: they run all of it, every library in every job, whatever `changes` gives, so
# that what a pull request leaves out runs as it lands.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # The libraries a pull request reaches, for the jobs below; tools/select_libraries.py's
    # docstring gives the rules. Its examples run first, on every event, so that a change
    # to the rules that breaks one fails here, before anything is selected by it. The
    # selection is a pull request's alone: on any other event the step does not run, its
    # outputs are empty, and each job below runs on the event alone.
    name: Select the libraries a pull request reaches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      libraries: ${{ steps.select.outputs.libraries }}
      deselect: ${{ steps.select.outputs.deselect }}
      uslib: ${{ steps.select.outputs.uslib }}
      uklib: ${{ steps.select.outputs.uklib }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # On a pull request, the merge commit GitHub makes of it, and the merge's parents.
        fetch-depth: 2

    - name: Run the selector's examples
      run: python3 -m doctest tools/select_libraries.py

    - name: Select the libraries the pull request reaches
      # HEAD is the pull request's merge commit, and HEAD^1, its first parent, the tip of
      # main it merges into, so the diff between them is what the pull request changes on
      # landing. Were HEAD no merge, HEAD^1 would be its parent and the diff one commit's,
      # which could select less than the pull request reaches, so the step fails instead.
      id: select
      if: github.event_name == 'pull_request'
      run: |
        git rev-parse --verify --quiet HEAD^2 > /dev/null || {
          echo "::error::HEAD is no merge commit, so HEAD^1 is not the pull request's base"
          exit 1
        }
        python3 tools/select_libraries.py HEAD^1 HEAD

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    # On a pull request, the legs run where `changes` selects any library; on any other
    # event, always.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.libraries != ''
    runs-on: ${{ matrix.os }}
    # The suites are slow: better than six thousand tests, every model reproducing its
    # technical notes' worked example cell by cell. Measured over the first full matrix
    # run, a cell takes between 15m45s (macOS, 3.14) and 33m25s (Windows, 3.12), with no
    # interpreter an outlier. This is about three times the slowest of those: a cell that
    # reaches it has hung, and should fail rather than hold a runner for the six-hour
    # default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 is the floor, and nothing here is held back to an older interpreter:
        # `requirements.txt` asks for pandas >= 2.2 and numpy >= 1.26, whose current
        # releases require 3.11 or later themselves.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      # There is no package to install: this repository is a staging ground, not a
      # distribution, and the models are plain modelx that the suites read from the
      # working tree. `requirements.txt` is the whole environment, pytest included.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the model suites with pytest
      # `pytest` from the root, as lifelib's CI runs it, every library in one process. The
      # suites are slow -- every model reproduces its technical notes' worked example,
      # cell by cell -- so report the slowest tests to keep an eye on which models
      # dominate the run. uslib's `_US_SEC` and uklib's `_UK_SEC` modules are left to the
      # `sec` and `sec_uk` jobs below; the SEC models' conventions, their registries and
      # each library's harness still run here. On a pull request every library is
      # collected all the same, and then the tests of each library `changes` did not
      # select are deselected, `--deselect lifelib/libraries/<lib>/`; on any other event
      # none is, and this is the bare `pytest` above.
      run: >-
        pytest -q --durations=10
        --ignore-glob='*test_*_us_sec.py' --ignore-glob='*test_*_uk_sec.py'
        ${{ github.event_name == 'pull_request' && needs.changes.outputs.deselect || '' }}

    - name: Run uklib's tests of a sum's bits where sum() adds left to right
      # Python 3.11's sum() adds floats left to right, where from 3.12 it compensates, so
      # each uklib SEC test that holds a total to `sum`'s last bit holds what rests on no
      # sum first, and then skips the bits there, naming 3.11 (UKLIB-SEC-PLAN.md, M15).
      # Their modules run in the `sec_uk` job alone, on 3.13, where no guard skips, so an
      # assertion resting on sum moved before its guard would be green in every job. This
      # step runs those tests, by node id, and each module's test of its guard, on one leg
      # of 3.11: the guarded ones skip at the guard, naming 3.11; IP's cohort sums on the
      # full grid skip too, as everywhere UKLIB_SEC_FULL is unset; the rest pass. They need
      # neither modelx-cython nor docutils, which this job does not install, and take about
      # two minutes. test_compiled_conventions_uk.py holds the step to -q, -rs and the node
      # ids of the tests that reach the guard, so that one guarded later fails until it is
      # added here, and pins what each asserts before its guard. On a pull request it runs
      # whether `changes` selects uklib or not, since that test holds its condition to the
      # leg alone.
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      run: >-
        pytest -q -rs
        lifelib/libraries/uklib/tests/test_term_assurance_uk_sec.py::test_the_sums_bits_skip_only_where_sum_adds_left_to_right
        lifelib/libraries/uklib/tests/test_term_assurance_uk_sec.py::test_the_ledger_residual_is_s_own_bit_for_bit
        lifelib/libraries/uklib/tests/test_critical_illness_uk_sec.py::test_the_sums_bits_skip_only_where_sum_adds_left_to_right
        lifelib/libraries/uklib/tests/test_critical_illness_uk_sec.py::test_the_all_total_is_s_total_bit_for_bit
        lifelib/libraries/uklib/tests/test_income_protection_uk_sec.py::test_the_sums_bits_skip_only_where_sum_adds_left_to_right
        lifelib/libraries/uklib/tests/test_income_protection_uk_sec.py::test_the_all_total_is_s_total_bit_for_bit
        lifelib/libraries/uklib/tests/test_income_protection_uk_sec.py::test_the_cohort_sums_are_s_sums_bit_for_bit
        lifelib/libraries/uklib/tests/test_with_profits_uk_sec.py::test_the_sums_bits_skip_only_where_sum_adds_left_to_right
        lifelib/libraries/uklib/tests/test_with_profits_uk_sec.py::test_the_all_total_is_s_total_bit_for_bit

    - name: Hold uklib's SEC harness to uslib's
      # uk_sec_support.py is uslib's sec_support.py under uklib's own name, the libraries'
      # product specs apart; the check fails on any shared function, class or constant
      # whose code differs (UKLIB-SEC-PLAN.md U3, K10). It reads the two files alone. It
      # runs on every leg the job runs, whatever `changes` selects, so a pull request that
      # changes either copy is held to the other.
      run: python tools/check_sec_harness.py

  cython:
    # The tests marked `cython`, which compile a model with modelx-cython and check the
    # compiled model against modelx (USLIB-SEC-PLAN.md D13). The job above skips them:
    # modelx-cython needs a C compiler, so it is not in `requirements.txt` but in
    # `requirements-cython.txt`. Linux and Windows, because the compiler is what differs,
    # gcc on one and MSVC on the other, and Windows is where a compiled model differs most:
    # MSVC, and a main thread with a 1 MB C stack (the plan's F7). One Python each: the job
    # above already runs every interpreter, and a compile failure belongs to the compiler
    # and the generated C rather than to an interpreter's minor version.
    name: Compile ${{ matrix.shard }} on ${{ matrix.os }}
    # On a pull request, where `changes` selects uslib; on any other event, always.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.uslib == 'true'
    runs-on: ${{ matrix.os }}
    # Run 18, with two models compiled, took 8 minutes a leg, WholeLife's share 4 to 5 of
    # them, so twelve would not fit an hour in one leg. A leg now runs one shard: the
    # largest, WholeLife's at full size, took 6 minutes locally under load, more slowly
    # under MSVC. An hour still fails a hung build long before the six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One shard to a leg, as the `sec` job runs one module to a leg (USLIB-SEC-PLAN.md
        # D13, decided at M16): `toolchain`, test_cython_toolchain.py and any compile test
        # tied to no one model, and for each SEC model at stage "EC" its product directory,
        # its module's compile tests with its cases of test_compiled_conventions.py, in one
        # session, so that it compiles once. A product's C step adds its shard here, and
        # test_compiled_conventions.py, in the `test` job, fails until the list is exactly
        # the registry's.
        shard: [toolchain, term_life, whole_life, universal_life, variable_ul,
                guaranteed_ul, fixed_deferred_annuity, immediate_annuity,
                deferred_income_annuity,
                fixed_indexed_annuity, indexed_ul,
                variable_annuity, registered_index_linked_annuity]
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    env:
      # Here a skip is a failure. The compile tests skip without modelx-cython or a
      # compiler, which keeps the job above and lifelib's own bare `pytest` green; in this
      # job, which installs both, a skip would be a green run that compiled nothing.
      USLIB_REQUIRE_CYTHON: '1'
      # The compiled grids at full size on Linux, as the `sec` job runs the modelx grids;
      # Windows keeps the core, where MSVC and the 1 MB stack are what it tests.
      USLIB_SEC_FULL: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # The shard this leg runs, by which conftest.py deselects every compile test outside
      # it. Under USLIB_REQUIRE_CYTHON a shard that selects none is an error, and a name
      # that is no shard is one anywhere.
      USLIB_CYTHON_SHARD: ${{ matrix.shard }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-cython.txt

    - name: Install dependencies
      # The base environment and modelx-cython, which brings Cython. No step installs a
      # compiler: both runner images carry one, and setuptools finds MSVC on its own.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-cython.txt

    - name: Run the compile tests with pytest
      # Only uslib's suite is collected here, uklib's compile tests running in `cython_uk`
      # below, and `-m cython` selects them: test_cython_toolchain.py, which compiles
      # Term_US_S, and from its
      # Phase 2 on each SEC model's own, Term_US_SEC's first (M14), with the stage-EC
      # conventions of test_compiled_conventions.py, which compile the model once a
      # session and hold the compiled model to modelx; of those, conftest.py keeps the
      # leg's shard. A run that selects nothing fails, which is wanted for the same reason
      # a skip is.
      run: pytest -q -m cython --durations=10 lifelib/libraries/uslib/tests

  cython_uk:
    # uklib's compile tests, as the `cython` job runs uslib's (UKLIB-SEC-PLAN.md U7): one
    # shard to a leg, `toolchain`, test_cython_toolchain_uk.py and any compile test tied to
    # no one model, and for each uklib SEC model at stage "EC" its product directory, its
    # module's compile tests with its cases of test_compiled_conventions_uk.py, in one
    # session. A product's C step adds its shard here, and test_compiled_conventions_uk.py,
    # in the `test` job, fails until the list is exactly uklib's registry's: term
    # assurance's, Term_UK_SEC's, first (M2), then critical illness's, CI_UK_SEC's
    # (M4), the unit-linked bond's, ULB_UK_SEC's (M10), whole of life's, WOL_UK_SEC's
    # (M6), the pension annuity's, PA_UK_SEC's (M12), with-profits', WP_UK_SEC's (M14),
    # and income protection's, IP_UK_SEC's (M8).
    name: Compile uklib ${{ matrix.shard }} on ${{ matrix.os }}
    # On a pull request, where `changes` selects uklib; on any other event, always.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.uklib == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [toolchain, term_assurance, critical_illness, whole_of_life, unit_linked_bond,
                pension_annuity, with_profits, income_protection]
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    env:
      # As in the `cython` job: here a skip is a failure, the compiled grids run at full
      # size on Linux, and the leg runs one shard, which conftest.py selects.
      UKLIB_REQUIRE_CYTHON: '1'
      UKLIB_SEC_FULL: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      UKLIB_CYTHON_SHARD: ${{ matrix.shard }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-cython.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-cython.txt

    - name: Run the compile tests with pytest
      # uklib's suite alone, and of it the tests marked `cython` in the leg's shard. A run
      # that selects nothing fails, as in the `cython` job.
      run: pytest -q -m cython --durations=10 lifelib/libraries/uklib/tests

  sec:
    # uslib's `_US_SEC` test modules, one to a leg (USLIB-SEC-PLAN.md K6). Each module
    # runs a core of its splice grid by default, and the rest of the grid, marked
    # `sec_full`, skips unless USLIB_SEC_FULL is 1. The core runs on Windows and macOS,
    # the full grid, which holds the core, on Linux; one Python, as the `cython` job has,
    # since the `test` job runs every interpreter over the S models these modules compare
    # with.
    name: SEC ${{ matrix.module }} (${{ matrix.grid }}) on ${{ matrix.os }}
    # On a pull request, where `changes` selects uslib; on any other event, always.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.uslib == 'true'
    runs-on: ${{ matrix.os }}
    # Measured locally under load, the slowest module, IUL's, took about 15 minutes over
    # its core and 34 over its full grid. An hour is room for a slower runner, and fails a
    # hung leg long before the six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [term_life, whole_life, universal_life, variable_ul, guaranteed_ul,
                 indexed_ul, fixed_deferred_annuity, fixed_indexed_annuity,
                 variable_annuity, registered_index_linked_annuity, immediate_annuity,
                 deferred_income_annuity]
        os: [ubuntu-latest, windows-latest, macos-latest]
        grid: [core, full]
        exclude:
          - {os: ubuntu-latest, grid: core}
          - {os: windows-latest, grid: full}
          - {os: macos-latest, grid: full}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install docutils for the docstring parse tests
      # The tests marked `docutils` read each model's docstrings as the docs build does.
      # docutils is no requirement of the models, so `requirements.txt` leaves it out and
      # those tests skip without it; the full-grid legs install it, and set
      # USLIB_REQUIRE_DOCUTILS below, under which such a skip fails (USLIB-SEC-PLAN.md
      # §5.4).
      if: matrix.grid == 'full'
      run: pip install docutils

    - name: Run the module with pytest
      env:
        USLIB_SEC_FULL: ${{ matrix.grid == 'full' && '1' || '' }}
        USLIB_REQUIRE_DOCUTILS: ${{ matrix.grid == 'full' && '1' || '' }}
      run: >-
        pytest -q --durations=10
        lifelib/libraries/uslib/tests/test_${{ matrix.module }}_us_sec.py

  sec_uk:
    # uklib's `_UK_SEC` test modules, one to a leg, as the `sec` job runs uslib's
    # (UKLIB-SEC-PLAN.md U7). Each module runs a core of its splice grid by default, and
    # the rest of the grid, marked `sec_full`, skips unless UKLIB_SEC_FULL is 1. The core
    # runs on Windows and macOS, the full grid, which holds the core, on Linux; one Python,
    # as in the `sec` job. A product's E step adds its module to the list.
    name: SEC uklib ${{ matrix.module }} (${{ matrix.grid }}) on ${{ matrix.os }}
    # On a pull request, where `changes` selects uklib; on any other event, always.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.uklib == 'true'
    runs-on: ${{ matrix.os }}
    # Measured locally, Term_UK_SEC's module took about a minute over its core and two
    # over its full grid. The hour is the `sec` job's, room for the larger products to
    # come, and fails a hung leg long before the six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [term_assurance, critical_illness, whole_of_life, unit_linked_bond,
                 pension_annuity,
                 income_protection, with_profits]
        os: [ubuntu-latest, windows-latest, macos-latest]
        grid: [core, full]
        exclude:
          - {os: ubuntu-latest, grid: core}
          - {os: windows-latest, grid: full}
          - {os: macos-latest, grid: full}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install docutils for the docstring parse tests
      # As in the `sec` job: the full-grid legs install docutils and set
      # UKLIB_REQUIRE_DOCUTILS below, under which a skipped `docutils` test fails.
      if: matrix.grid == 'full'
      run: pip install docutils

    - name: Run the module with pytest
      env:
        UKLIB_SEC_FULL: ${{ matrix.grid == 'full' && '1' || '' }}
        UKLIB_REQUIRE_DOCUTILS: ${{ matrix.grid == 'full' && '1' || '' }}
      run: >-
        pytest -q --durations=10
        lifelib/libraries/uklib/tests/test_${{ matrix.module }}_uk_sec.py
