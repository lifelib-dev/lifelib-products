# Run the reference-model suites the way lifelib's own CI will run them.
#
# The models here are drafted for merging into lifelib, so the gate in this repository is
# the gate they will meet there: a bare `pytest` from the repository root, which collects
# every library's in-library `tests/` directory in one process. That single-process
# collection is the condition the per-library registry modules exist to survive
# (MERGE.md section 7), so running the suites any other way -- one library at a time --
# would pass while proving less than upstream requires.
#
# The second job, `cython`, is this repository's own rather than a rehearsal of upstream's.
# It runs the compile tests, which need modelx-cython and a C compiler. lifelib's CI will
# not install modelx-cython, and there, as in the `test` job here, those tests skip
# (USLIB-SEC-PLAN.md D13). One shard of them to a leg: the toolchain, or one compiled
# model.
#
# The third job, `sec`, runs uslib's twelve `_US_SEC` test modules, which the `test` job
# leaves out: in every leg of it they took the leg to its 90-minute timeout (Tests run 14,
# USLIB-SEC-PLAN.md K6). One module to a leg, so no leg holds them all.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suites are slow: better than six thousand tests, every model reproducing its
    # technical notes' worked example cell by cell. Measured over the first full matrix
    # run, a cell takes between 15m45s (macOS, 3.14) and 33m25s (Windows, 3.12), with no
    # interpreter an outlier. This is about three times the slowest of those: a cell that
    # reaches it has hung, and should fail rather than hold a runner for the six-hour
    # default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 is the floor, and nothing here is held back to an older interpreter:
        # `requirements.txt` asks for pandas >= 2.2 and numpy >= 1.26, whose current
        # releases require 3.11 or later themselves.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      # There is no package to install: this repository is a staging ground, not a
      # distribution, and the models are plain modelx that the suites read from the
      # working tree. `requirements.txt` is the whole environment, pytest included.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the model suites with pytest
      # `pytest` from the root, as lifelib's CI runs it, every library in one process. The
      # suites are slow -- every model reproduces its technical notes' worked example,
      # cell by cell -- so report the slowest tests to keep an eye on which models
      # dominate the run. uslib's `_US_SEC` modules are left to the `sec` job below; the
      # SEC models' conventions, their registry and `sec_support` still run here.
      run: pytest -q --durations=10 --ignore-glob='*test_*_us_sec.py'

  cython:
    # The tests marked `cython`, which compile a model with modelx-cython and check the
    # compiled model against modelx (USLIB-SEC-PLAN.md D13). The job above skips them:
    # modelx-cython needs a C compiler, so it is not in `requirements.txt` but in
    # `requirements-cython.txt`. Linux and Windows, because the compiler is what differs,
    # gcc on one and MSVC on the other, and Windows is where a compiled model differs most:
    # MSVC, and a main thread with a 1 MB C stack (the plan's F7). One Python each: the job
    # above already runs every interpreter, and a compile failure belongs to the compiler
    # and the generated C rather than to an interpreter's minor version.
    name: Compile ${{ matrix.shard }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Run 18, with two models compiled, took 8 minutes a leg, WholeLife's share 4 to 5 of
    # them, so twelve would not fit an hour in one leg. A leg now runs one shard: the
    # largest, WholeLife's at full size, took 6 minutes locally under load, more slowly
    # under MSVC. An hour still fails a hung build long before the six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One shard to a leg, as the `sec` job runs one module to a leg (USLIB-SEC-PLAN.md
        # D13, decided at M16): `toolchain`, test_cython_toolchain.py and any compile test
        # tied to no one model, and for each SEC model at stage "EC" its product directory,
        # its module's compile tests with its cases of test_compiled_conventions.py, in one
        # session, so that it compiles once. A product's C step adds its shard here, and
        # test_compiled_conventions.py, in the `test` job, fails until the list is exactly
        # the registry's.
        shard: [toolchain, term_life, whole_life, universal_life, variable_ul,
                guaranteed_ul, fixed_deferred_annuity, immediate_annuity,
                deferred_income_annuity]
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    env:
      # Here a skip is a failure. The compile tests skip without modelx-cython or a
      # compiler, which keeps the job above and lifelib's own bare `pytest` green; in this
      # job, which installs both, a skip would be a green run that compiled nothing.
      USLIB_REQUIRE_CYTHON: '1'
      # The compiled grids at full size on Linux, as the `sec` job runs the modelx grids;
      # Windows keeps the core, where MSVC and the 1 MB stack are what it tests.
      USLIB_SEC_FULL: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # The shard this leg runs, by which conftest.py deselects every compile test outside
      # it. Under USLIB_REQUIRE_CYTHON a shard that selects none is an error, and a name
      # that is no shard is one anywhere.
      USLIB_CYTHON_SHARD: ${{ matrix.shard }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-cython.txt

    - name: Install dependencies
      # The base environment and modelx-cython, which brings Cython. No step installs a
      # compiler: both runner images carry one, and setuptools finds MSVC on its own.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-cython.txt

    - name: Run the compile tests with pytest
      # Only uslib has compile tests, so only its suite is collected, and `-m cython`
      # selects them: test_cython_toolchain.py, which compiles Term_US_S, and from its
      # Phase 2 on each SEC model's own, Term_US_SEC's first (M14), with the stage-EC
      # conventions of test_compiled_conventions.py, which compile the model once a
      # session and hold the compiled model to modelx; of those, conftest.py keeps the
      # leg's shard. A run that selects nothing fails, which is wanted for the same reason
      # a skip is.
      run: pytest -q -m cython --durations=10 lifelib/libraries/uslib/tests

  sec:
    # uslib's `_US_SEC` test modules, one to a leg (USLIB-SEC-PLAN.md K6). Each module
    # runs a core of its splice grid by default, and the rest of the grid, marked
    # `sec_full`, skips unless USLIB_SEC_FULL is 1. The core runs on Windows and macOS,
    # the full grid, which holds the core, on Linux; one Python, as the `cython` job has,
    # since the `test` job runs every interpreter over the S models these modules compare
    # with.
    name: SEC ${{ matrix.module }} (${{ matrix.grid }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Measured locally under load, the slowest module, IUL's, took about 15 minutes over
    # its core and 34 over its full grid. An hour is room for a slower runner, and fails a
    # hung leg long before the six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [term_life, whole_life, universal_life, variable_ul, guaranteed_ul,
                 indexed_ul, fixed_deferred_annuity, fixed_indexed_annuity,
                 variable_annuity, registered_index_linked_annuity, immediate_annuity,
                 deferred_income_annuity]
        os: [ubuntu-latest, windows-latest, macos-latest]
        grid: [core, full]
        exclude:
          - {os: ubuntu-latest, grid: core}
          - {os: windows-latest, grid: full}
          - {os: macos-latest, grid: full}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install docutils for the docstring parse tests
      # The tests marked `docutils` read each model's docstrings as the docs build does.
      # docutils is no requirement of the models, so `requirements.txt` leaves it out and
      # those tests skip without it; the full-grid legs install it, and set
      # USLIB_REQUIRE_DOCUTILS below, under which such a skip fails (USLIB-SEC-PLAN.md
      # §5.4).
      if: matrix.grid == 'full'
      run: pip install docutils

    - name: Run the module with pytest
      env:
        USLIB_SEC_FULL: ${{ matrix.grid == 'full' && '1' || '' }}
        USLIB_REQUIRE_DOCUTILS: ${{ matrix.grid == 'full' && '1' || '' }}
      run: >-
        pytest -q --durations=10
        lifelib/libraries/uslib/tests/test_${{ matrix.module }}_us_sec.py
